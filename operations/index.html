<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e342c">
  <title>Form &amp; Frame — Owner Desk</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="F&amp;F Desk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#page">Skip to content</a>

  <section id="setup" class="login" aria-labelledby="loginTitle">
    <div class="login-card">
      <div class="login-brand"><img src="./icon.svg" alt="" width="56" height="56"><span>FORM <b>&amp;</b> FRAME</span></div>
      <h1 id="loginTitle">Owner Desk</h1>
      <p id="setupCopy">Enter your work email and we will send you a secure sign-in link.</p>
      <form id="login"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" placeholder="name@company.co.uk" required><button class="btn primary">Send secure link</button></form>
      <p id="loginMsg" role="status" aria-live="polite"></p>
      <div id="accessActions" hidden><button id="retryAccess" type="button" class="btn">Try again</button><button id="accessSignOut" type="button" class="btn">Sign out</button></div>
      <a class="login-site" href="../index.html">Go to the public website</a>
    </div>
  </section>

  <div id="hub" class="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="Owner Desk dashboard"><img src="./icon.svg" alt="" width="34" height="34"><span><b>FORM &amp; FRAME</b><small>Owner Desk</small></span></a>
      <form class="global-search" id="globalSearch" role="search"><label class="sr-only" for="globalSearchInput">Find a customer, quotation, invoice or job</label><input id="globalSearchInput" type="search" placeholder="Find a customer, quotation or invoice" autocomplete="off"></form>
      <div class="top-actions">
        <span id="demoTag" class="demo-tag" hidden>DEMO</span>
        <button id="notifBell" class="icon-btn bell" type="button" aria-haspopup="dialog" aria-controls="notifPanel" aria-expanded="false" aria-label="Notifications, none unread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><b id="notifBadge" class="bell-badge" hidden>0</b></button>
        <a class="icon-btn" href="#/settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .3-1.5-1.5L17 5l-3-1-1 2h-2l-1-2-3 1 .5 2.3L6 8.8 4 8.5 3 11.5l2 1v2l-2 1 1 3 2-.3 1.5 1.5L7 21l3 1 1-2h2l1 2 3-1-.5-2.3 1.5-1.5 2 .3 1-3-2-1z"/></svg></a>
        <button id="enablePush" type="button" hidden>Enable notifications</button>
      </div>
    </header>
    <nav class="sidenav" id="sidenav" aria-label="Main sections"></nav>
    <main id="page" class="page" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main sections"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <p id="pushHelp" class="sr-only" role="status" aria-live="polite" hidden></p>
  <dialog id="dialog" class="dialog" aria-label="Form"><div id="dialogBody"></div></dialog>
  <dialog id="preview" class="dialog preview" aria-label="Document preview"><header class="preview-bar"><b id="previewTitle">Preview</b><span><button type="button" class="btn primary" id="previewPrint">Print / Save as PDF</button><button type="button" class="btn" id="previewClose">Close</button></span></header><iframe id="previewFrame" title="Document preview"></iframe></dialog>

  <aside id="notifPanel" class="nc" role="dialog" aria-modal="false" aria-labelledby="ncTitle" hidden>
    <header class="nc-head"><div><p>FORM &amp; FRAME · ALERTS</p><h2 id="ncTitle">Notifications</h2></div><button type="button" id="ncClose" class="btn" aria-label="Close notifications">Close</button></header>
    <div class="nc-tabs" role="tablist"><button type="button" role="tab" data-nc-tab="inbox" aria-selected="true">Inbox <b id="ncTabCount" hidden></b></button><button type="button" role="tab" data-nc-tab="settings" aria-selected="false">Settings &amp; install</button></div>
    <section id="ncInbox" class="nc-body"><div class="nc-toolbar"><button type="button" id="ncMarkAll" class="btn">Mark all read</button></div><p id="ncNote" class="nc-note" role="status" hidden></p><div id="ncList"></div></section>
    <section id="ncSettings" class="nc-body" hidden><div id="ncDevice"></div><div id="ncIcon"></div><div id="ncPrefs"></div><p id="ncPrefNote" class="nc-note" role="status" hidden></p></section>
  </aside>
  <script src="./config.js"></script><script type="module" src="./app.js"></script>
</body>
</html>
