<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form & Frame — Operations</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><header><a class="brand" href="../index.html">FORM <b>&amp;</b> FRAME</a><span>PRIVATE OPERATIONS HUB</span></header>
<section id="setup" class="panel"><p class="eyebrow">STAFF ACCESS</p><h1>Anthony’s project desk.</h1><p id="setupCopy">Enter your work email for a secure sign-in link.</p><form id="login"><input id="email" type="email" placeholder="anthony@company.co.uk" required><button>Send secure link</button></form><small id="loginMsg"></small></section>
<section id="hub" hidden><div class="top"><div><p class="eyebrow">LIVE OPERATIONS</p><h1>Today’s project desk.</h1></div><button id="signOut" class="quiet">Sign out</button></div><div class="stats" id="stats"></div><div class="grid"><section class="panel"><div class="title"><div><p class="eyebrow">INQUIRIES</p><h2>New and active leads</h2></div><button id="refresh" class="quiet">Refresh</button></div><div id="leads" class="leads"></div></section><aside class="panel"><p class="eyebrow">AVAILABILITY</p><h2>Block a work slot</h2><form id="block"><label>Title<input id="blockTitle" required value="Unavailable"></label><label>Starts<input id="blockStart" type="datetime-local" required></label><label>Ends<input id="blockEnd" type="datetime-local" required></label><button>Block calendar</button></form><div class="title compact"><h2>Upcoming blocks</h2><button id="unblockAll" class="quiet">Refresh</button></div><div id="calendar" class="calendar"></div></aside></div></section></main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
