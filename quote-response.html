<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation response · Form & Frame</title><style>body{font:17px/1.6 system-ui;background:#f7f4ed;color:#123c30;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:490px;padding:35px;background:white;border:1px solid #c99b55;border-radius:16px}button{padding:14px 22px;background:#123c30;color:white;border:0;border-radius:7px;margin:6px;cursor:pointer}button:last-of-type{background:#735b52}</style></head><body><main><h1>FORM & FRAME</h1><h2>Respond to your quotation</h2><p>Review the PDF quotation attached to your email before making a decision.</p><button id="accept">Accept quotation</button><button id="decline">Decline quotation</button><p id="status" role="status"></p></main><script type="module">const token=new URLSearchParams(location.search).get('token');history.replaceState({},'',location.pathname);const status=document.getElementById('status');for(const [id,decision] of [['accept','accepted'],['decline','rejected']])document.getElementById(id).onclick=async()=>{if(!token||!confirm('Confirm your quotation response?'))return;document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='Recording your response…';try{const response=await fetch('https://otqzhocismdjbvvsjnpe.supabase.co/functions/v1/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,decision})});if(!response.ok)throw Error();status.textContent=decision==='accepted'?'Thank you. Your quotation has been accepted.':'Your response has been recorded. Thank you.';}catch{status.textContent='Unable to record this response. Please contact Form & Frame.';document.querySelectorAll('button').forEach(b=>b.disabled=false)}};</script></body></html>
