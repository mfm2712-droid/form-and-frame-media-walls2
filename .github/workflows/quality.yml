name: Quality checks

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and public build boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run offline tests
        run: TZ=Europe/London node --test

      - name: Check JavaScript and TypeScript syntax
        # Globs, not a hand-kept list, so a removed or added module can never be missed.
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for file in operations/*.js operations/*.mjs scripts/*.mjs supabase/*.mjs supabase/functions/*/*.mjs; do
            node --check "$file"; count=$((count + 1))
          done
          for file in supabase/functions/*/index.ts; do
            node --experimental-strip-types --check "$file"; count=$((count + 1))
          done
          test -f supabase/functions/quote-response/handler.mjs
          test -f supabase/functions/quote-response/index.ts
          echo "Syntax checked $count files"
          node scripts/check-inline-scripts.mjs index.html operations/index.html quote-response.html docs/MASTER_DOCUMENTATION.html

      - name: Apply every migration to a throwaway PostgreSQL and run the database tests
        run: ./scripts/test-migrations.sh

      - name: Ensure production builds fail without Supabase configuration
        run: |
          if VERCEL_ENV=production node scripts/build-public.mjs; then
            echo 'Expected the unconfigured production build to fail.' >&2
            exit 1
          fi

      - name: Build the public site with fictional configuration
        run: |
          b64() { printf '%s' "$1" | base64 -w0 | tr '+/' '-_' | tr -d '='; }
          export FF_PUBLIC_SUPABASE_ANON_KEY="$(b64 '{"alg":"HS256","typ":"JWT"}').$(b64 '{"role":"anon","ref":"otqzhocismdjbvvsjnpe"}').$(b64 fictional-signature)"
          node scripts/build-public.mjs
        env:
          VERCEL_ENV: production
          FF_PUBLIC_SUPABASE_URL: https://otqzhocismdjbvvsjnpe.supabase.co

      - name: Verify public build contents
        run: node scripts/check-public-build.mjs
