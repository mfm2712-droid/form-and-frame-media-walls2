<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Notifications pipeline (main)"><rect width="1200" height="540" fill="#E6E1D5"/><defs><marker id="ah-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E4D45"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4823F"/></marker><marker id="ah-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2892A"/></marker><marker id="ah-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9E3B2C"/></marker></defs><text x="18" y="26" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="#211F1A">Notifications pipeline (main)</text><rect x="30" y="80" width="200" height="60" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="130" y="106.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Public enquiry</text><text x="130" y="124.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">submit-enquiry saved it</text><rect x="30" y="220" width="200" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="130" y="245" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Staff workflow change</text><text x="130" y="263" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">quote / job / appointment /</text><text x="130" y="276" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">invoice / payment</text><rect x="270" y="320" width="230" height="60" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="385" y="346.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">DB triggers</text><text x="385" y="364.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">queue_workflow_push_notification</text><rect x="290" y="130" width="210" height="80" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="395" y="160" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">notification_events</text><text x="395" y="178" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#CFE3DC">channel, delivery_status</text><text x="395" y="191" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#CFE3DC">attempt_count, next_attempt_at</text><rect x="600" y="70" width="190" height="60" rx="4" fill="#EEEADF" stroke="#7C766A" stroke-width="1.6" /><text x="695" y="96.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Resend e-mail</text><text x="695" y="114.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#7C766A">owner alert, reference only</text><rect x="600" y="170" width="200" height="60" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="700" y="196.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">push-new-enquiry</text><text x="700" y="214.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.7" fill="#CFE3DC">Web Push to subscribed devices</text><rect x="880" y="170" width="190" height="60" rx="4" fill="#EEEADF" stroke="#7C766A" stroke-width="1.6" /><text x="975" y="196.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Staff devices</text><text x="975" y="214.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">push_subscriptions</text><rect x="600" y="290" width="200" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="700" y="315" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">retry-notifications</text><text x="700" y="333" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">pg_cron, max 10 per run,</text><text x="700" y="346" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">backoff capped at 16 min</text><rect x="880" y="290" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="975" y="321.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Notification centre</text><text x="975" y="339.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">inbox, mark read, prefs</text><rect x="600" y="400" width="330" height="60" rx="4" fill="#FBF3E4" stroke="#D2892A" stroke-width="1.6" stroke-dasharray="2 3"/><text x="765" y="426.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Retry cap + dead-letter state</text><text x="765" y="444.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#8A5A12">unbounded today; draft in PR #22 (unapplied)</text><text x="30" y="440" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">E-mail = one internal alert per enquiry (to NOTIFICATION_EMAIL). No customer-facing e-mail exists.</text><text x="30" y="460" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">No SMS, no WhatsApp, no customer confirmation message (the app says so on screen).</text><rect x="30" y="516" width="18" height="12" rx="2" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.4" /><text x="54" y="526" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">on main</text><rect x="110.1" y="516" width="18" height="12" rx="2" fill="#FBF3E4" stroke="#D2892A" stroke-width="1.4" stroke-dasharray="2 3"/><text x="134.1" y="526" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">only in open Draft PR</text><rect x="278.4" y="516" width="18" height="12" rx="2" fill="#FBF3E4" stroke="#B4823F" stroke-width="1.4" stroke-dasharray="6 4"/><text x="302.4" y="526" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">planned / not built</text><rect x="434.09999999999997" y="516" width="18" height="12" rx="2" fill="#EEEADF" stroke="#7C766A" stroke-width="1.4" /><text x="458.09999999999997" y="526" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">external service</text><polyline points="230,110 260,110 260,160 290,160 290,170" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="230,255 250,255 250,350 270,350 270,350" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="385,320 395,320 395,210 395,210" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="500,170 550,160 550,100 600,100 600,100" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="500,170 550,190 550,200 600,200 600,200" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="800,200 880,200" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="600,325 560,325 560,250 460,250 460,210 395,210" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="395,130 395,110 1000,110 1000,290 975,290" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><rect x="980" y="241" width="40" height="16" rx="3" fill="#E6E1D5" opacity="0.95"/><text x="1000" y="253" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">reads</text><polyline points="765,400 700,400 700,360 700,360" fill="none" stroke="#D2892A" stroke-dasharray="2 3" stroke-width="1.8" marker-end="url(#ah-pr)"/></svg>
