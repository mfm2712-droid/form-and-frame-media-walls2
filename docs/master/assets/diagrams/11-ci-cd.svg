<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label=".github/workflows/quality.yml (job 'verify', Node 24, Ubuntu)"><rect width="1200" height="400" fill="#E6E1D5"/><defs><marker id="ah-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E4D45"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4823F"/></marker><marker id="ah-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2892A"/></marker><marker id="ah-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9E3B2C"/></marker></defs><text x="18" y="26" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="#211F1A">.github/workflows/quality.yml (job 'verify', Node 24, Ubuntu)</text><rect x="20" y="110" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="145" y="141.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">1. Checkout</text><text x="145" y="159.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">persist-credentials: false</text><rect x="310" y="110" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="435" y="141.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">2. Setup Node 24</text><text x="435" y="159.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">no package cache</text><rect x="600" y="110" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="725" y="141.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">3. node --test</text><text x="725" y="159.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">TZ=Europe/London</text><rect x="890" y="110" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="1015" y="135" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">4. Syntax checks</text><text x="1015" y="153" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">29 node --check cmds</text><text x="1015" y="166" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">(3 with strip-types)</text><rect x="20" y="240" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="145" y="271.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">5. check-inline-scripts</text><text x="145" y="289.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">parses inline JS</text><rect x="310" y="240" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="435" y="271.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">6. Prod build must FAIL</text><text x="435" y="289.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">no config = error</text><rect x="600" y="240" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="725" y="271.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">7. Fictional-config build</text><text x="725" y="289.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">anon JWT, fake sig</text><rect x="890" y="240" width="250" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="1015" y="271.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">8. check-public-build</text><text x="1015" y="289.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">allowed files only</text><rect x="20" y="52" width="400" height="36" rx="4" fill="#F4F1E8" stroke="#1E4D45" stroke-width="1.6" /><text x="220" y="75" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Triggers: push to main, pull_request to main</text><rect x="600" y="52" width="560" height="36" rx="4" fill="#F7E6E2" stroke="#9E3B2C" stroke-width="1.6" /><text x="880" y="75" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="12.8" fill="#211F1A">PRs targeting other branches (e.g. audit branch) do not run this workflow</text><text x="20" y="345" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">Not in CI: browser tests, accessibility audit, live Supabase, RLS in real Postgres (PGlite tests run only with PGLITE_MODULE).</text><text x="20" y="365" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">Vercel Preview is a separate check outside this workflow.</text><polyline points="270,145 310,145" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="560,145 600,145" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="850,145 890,145" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="1015,180 865,200 865,215 145,215 145,240 145,240" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="270,275 310,275" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="560,275 600,275" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="850,275 890,275" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/></svg>
