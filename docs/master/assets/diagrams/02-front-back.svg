<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Front end / back end"><rect width="1200" height="560" fill="#E6E1D5"/><defs><marker id="ah-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E4D45"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4823F"/></marker><marker id="ah-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2892A"/></marker><marker id="ah-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9E3B2C"/></marker></defs><text x="18" y="26" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="#211F1A">Front end / back end</text><rect x="20" y="50" width="360" height="490" rx="6" fill="none" stroke="#B8B2A2" stroke-width="1.4" stroke-dasharray="3 3"/><text x="32" y="68" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.2" fill="#7C766A">BROWSER</text><rect x="420" y="50" width="250" height="230" rx="6" fill="none" stroke="#B8B2A2" stroke-width="1.4" stroke-dasharray="3 3"/><text x="432" y="68" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.2" fill="#7C766A">VERCEL (STATIC HOSTING)</text><rect x="710" y="50" width="470" height="490" rx="6" fill="none" stroke="#B8B2A2" stroke-width="1.4" stroke-dasharray="3 3"/><text x="722" y="68" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.2" fill="#7C766A">SUPABASE</text><rect x="40" y="100" width="320" height="70" rx="4" fill="#F4F1E8" stroke="#1E4D45" stroke-width="1.6" /><text x="200" y="131.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Static files loaded</text><text x="200" y="149.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">HTML / JS / CSS / icons / service worker</text><rect x="40" y="300" width="320" height="90" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="200" y="335" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Staff PWA /operations/</text><text x="200" y="353" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">app.js + ES modules, service worker</text><text x="200" y="366" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">supabase-js via https://esm.sh (pinned)</text><rect x="40" y="400" width="320" height="80" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="200" y="430" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Public site</text><text x="200" y="448" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">index.html, inline JS + CSS</text><text x="200" y="461" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">no framework, no bundler</text><rect x="450" y="90" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="545" y="121.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">dist/public</text><text x="545" y="139.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.3" fill="#CFE3DC">built by scripts/build-public.mjs</text><rect x="450" y="180" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="545" y="203.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">public-config.js</text><text x="545" y="219.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">operations/config.js</text><text x="545" y="237.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#CFE3DC">anon key + URL + VAPID public</text><rect x="740" y="100" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="835" y="131.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Storage</text><text x="835" y="149.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.1" fill="#CFE3DC">private bucket project-uploads</text><rect x="960" y="100" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="1055" y="131.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Auth</text><text x="1055" y="149.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">magic link (OTP)</text><rect x="740" y="305" width="190" height="80" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="835" y="335" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Postgres + RLS</text><text x="835" y="353" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#CFE3DC">REST (PostgREST), triggers,</text><text x="835" y="366" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#CFE3DC">realtime channel</text><rect x="960" y="305" width="190" height="80" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="1055" y="341.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">pg_cron + Vault</text><text x="1055" y="359.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.2" fill="#CFE3DC">retry schedule (SQL script)</text><rect x="740" y="400" width="190" height="90" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="835" y="428.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Edge Functions</text><text x="835" y="446.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">submit-enquiry</text><text x="835" y="459.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">push-new-enquiry</text><text x="835" y="472.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">retry-notifications</text><rect x="960" y="400" width="190" height="90" rx="4" fill="#F4F1E8" stroke="#1E4D45" stroke-width="1.6" /><text x="1055" y="441.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Function secrets</text><text x="1055" y="459.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">names only in docs</text><text x="430" y="385" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">Vercel serves files only: no server code,</text><text x="430" y="403" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">no database. vercel.json holds buildCommand</text><text x="430" y="421" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">and outputDirectory only (no headers).</text><rect x="40" y="520" width="18" height="12" rx="2" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.4" /><text x="64" y="530" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">on main</text><rect x="120.1" y="520" width="18" height="12" rx="2" fill="#F4F1E8" stroke="#1E4D45" stroke-width="1.4" /><text x="144.1" y="530" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">supporting</text><polyline points="450,125 420,125 420,135 360,135 360,135" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><rect x="387" y="141" width="46" height="16" rx="3" fill="#E6E1D5" opacity="0.95"/><text x="410" y="153" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">served</text><polyline points="360,345 740,345" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><rect x="455" y="336" width="190" height="16" rx="3" fill="#E6E1D5" opacity="0.95"/><text x="550" y="348" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">supabase-js: REST + Auth (JWT)</text><polyline points="360,440 550,440 550,445 740,445" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><rect x="393" y="431" width="124" height="16" rx="3" fill="#E6E1D5" opacity="0.95"/><text x="455" y="443" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211F1A">POST submit-enquiry</text><polyline points="1055,385 1055,395 835,395 835,400" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/></svg>
