<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Build and hosting (Vercel) - values are env var NAMES only"><rect width="1200" height="440" fill="#E6E1D5"/><defs><marker id="ah-real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E4D45"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4823F"/></marker><marker id="ah-pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2892A"/></marker><marker id="ah-broken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9E3B2C"/></marker></defs><text x="18" y="26" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="#211F1A">Build and hosting (Vercel) - values are env var NAMES only</text><rect x="30" y="90" width="170" height="70" rx="4" fill="#EEEADF" stroke="#7C766A" stroke-width="1.6" /><text x="115" y="121.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">GitHub repo</text><text x="115" y="139.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">main + frame/* branches</text><rect x="270" y="90" width="200" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="370" y="121.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Vercel build</text><text x="370" y="139.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.0" fill="#CFE3DC">node scripts/build-public.mjs</text><rect x="270" y="220" width="260" height="120" rx="4" fill="#F4F1E8" stroke="#1E4D45" stroke-width="1.6" /><text x="400" y="257" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Build env var names</text><text x="400" y="275" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">VERCEL_ENV</text><text x="400" y="288" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">FF_PUBLIC_SUPABASE_URL</text><text x="400" y="301" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">FF_PUBLIC_SUPABASE_ANON_KEY</text><text x="400" y="314" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#7C766A">FF_OPERATIONS_VAPID_PUBLIC_KEY</text><rect x="560" y="90" width="190" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="655" y="115" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">dist/public</text><text x="655" y="133" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">index.html, assets/,</text><text x="655" y="146" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">operations/, config js</text><rect x="830" y="60" width="220" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="940" y="85" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Production</text><text x="940" y="103" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.7" fill="#CFE3DC">VERCEL_ENV=production needs both keys</text><text x="940" y="116" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.7" fill="#CFE3DC">(build fails otherwise)</text><rect x="830" y="160" width="220" height="70" rx="4" fill="#1E4D45" stroke="#1E4D45" stroke-width="1.6" /><text x="940" y="191.5" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#F4F1E8">Preview</text><text x="940" y="209.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#CFE3DC">per PR; config optional</text><rect x="830" y="270" width="340" height="90" rx="4" fill="#F7E6E2" stroke="#9E3B2C" stroke-width="1.6" /><text x="1000" y="305" text-anchor="middle" font-family="Bricolage Grotesque, IBM Plex Sans, sans-serif" font-weight="700" font-size="14.0" fill="#211F1A">Not verified by this book</text><text x="1000" y="323" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#9E3B2C">live deployment state, domain settings,</text><text x="1000" y="336" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#9E3B2C">Vercel env values, response headers</text><text x="30" y="400" text-anchor="start" font-family="IBM Plex Sans, sans-serif" font-size="11.5" font-weight="400" fill="#211F1A">Guards in scripts/public-config.mjs: project ref pinned, anon-role JWT only, service keys refused.</text><polyline points="200,125 270,125" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="400,220 400,190 370,190 370,160" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="470,125 560,125" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="750,125 790,125 790,95 830,95" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/><polyline points="750,125 790,125 790,195 830,195" fill="none" stroke="#1E4D45" stroke-width="1.8" marker-end="url(#ah-real)"/></svg>
